

name: Deploy to Amazon ECS-BBMS

on:
  push:
    branches:
      - main
          # set this to the name of the container in the
                                               # containerDefinitions section of your task definition
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm install

    - name: Configure AWS credentials
      uses: appleboy/ssh-action@v0.1.8
      with:
        aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws_region: ${{ env.AWS_REGION }}
        aws_host: ${{secrets.SSH_HOST}}
        # aws_key: ${{secrets.SSH_KEY}}
        aws_port: ${{secrets.SSH_PORT}}
        aws_username: ${{secrets.SSH_USERNAME}}

        script: |
          cd /home/ubuntu/public.html/MERN_BBMS
          git pull origin main
          npm install
          npm run build
          pm2 restart app

    # - name: Login to Amazon ECR
    #   id: login-ecr
    #   uses: aws-actions/amazon-ecr-login@v1